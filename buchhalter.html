<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trabis — Buchhalter-Portal</title>
<link rel="icon" type="image/png" href="logo-circle.png"/>
<style>
:root{
  --bg:#f4faff; --card:#ffffff; --card2:#f4faff; --border:#bfc7d4; --primary:#0061a4; --primary-light:#dcebf7;
  --text:#001f2a; --text2:#404752; --text3:#707883; --shadow:0 2px 12px rgba(0,97,164,0.10);
  --income:#006e1c; --expense:#bb1614;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:clip}
button,input,select{font-family:inherit}
button{cursor:pointer}
.num{font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;unicode-bidi:isolate-override;direction:ltr}

/* login + client list */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{background:var(--card);border-radius:20px;padding:34px 30px;box-shadow:var(--shadow);width:100%;max-width:400px;text-align:center}
.auth-logo{width:56px;height:56px;border-radius:14px;margin-bottom:12px}
.auth-title{font-size:20px;font-weight:800;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--text2);margin-bottom:22px}
.auth-input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;background:var(--card2);color:var(--text);margin-bottom:12px;outline:none}
.auth-input:focus{border-color:var(--primary)}
.auth-btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-size:15px;font-weight:700}
.auth-error{color:var(--expense);font-size:13px;min-height:18px;margin-bottom:8px}
.auth-note{font-size:11.5px;color:var(--text3);margin-top:16px;line-height:1.5}
.acct-list{list-style:none;margin:0;padding:0;text-align:left}
.acct-item{display:flex;align-items:center;gap:12px;padding:13px 12px;border:1.5px solid var(--border);border-radius:14px;margin-bottom:10px;cursor:pointer;background:var(--card)}
.acct-item:hover{border-color:var(--primary)}
.acct-avatar{width:40px;height:40px;border-radius:12px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.acct-name{font-weight:700;font-size:15px}.acct-user{font-size:12px;color:var(--text3)}

/* shell */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--border)}
.tb-brand{display:flex;align-items:center;gap:12px;min-width:0}
.tb-brand img{width:40px;height:40px;border-radius:12px;flex:none}
.tb-t1{font-weight:800;font-size:17px;line-height:1.15}.tb-t2{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.tb-act{display:flex;gap:8px;flex:none}
.tb-btn{padding:8px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text2);font-size:12.5px;font-weight:700}
.tb-btn:hover{border-color:var(--primary);color:var(--primary)}
#view{padding:0}
.ro-badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text2);background:var(--primary-light);border-radius:999px;padding:3px 9px;margin-left:8px;vertical-align:middle}

/* period bar + tabs */
.pbar{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.pbar-in{max-width:1180px;margin:0 auto;padding:12px 28px 8px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.pbar-t b{font-size:16px}.pbar-t span{font-size:12px;color:var(--text3);margin-left:10px}
.pbar-p{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pbar-p label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)}
.pbar-p input{padding:7px 9px;border:1.5px solid var(--border);border-radius:8px;background:var(--card2);font-size:13px;color:var(--text)}
.tabbar{max-width:1180px;margin:0 auto;padding:0 28px;display:flex;gap:2px;overflow-x:auto}
.tabbar button{padding:10px 16px;border:none;background:none;font-size:13.5px;font-weight:700;color:var(--text2);border-bottom:3px solid transparent;white-space:nowrap}
.tabbar button.on{color:var(--primary);border-bottom-color:var(--primary)}
.content{max-width:1180px;margin:0 auto;padding:20px 28px 70px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin:26px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.kl{font-size:11.5px;color:var(--text3)}.kv{font-size:18px;font-weight:800;margin-top:3px}.ks{font-size:11.5px;color:var(--text2);margin-top:2px}
.dls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dl{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.dl-tag{flex:none;width:44px;height:44px;border-radius:8px;background:#eef3f8;color:var(--text2);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.dl-txt{flex:1;min-width:0}.dl-txt b{display:block;font-size:14px}.dl-txt span{display:block;font-size:12px;color:var(--text2);margin-top:2px;line-height:1.4}
.dl-btn{flex:none;padding:9px 14px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:12.5px;font-weight:700}
.dl-btn.sm{padding:8px 12px}.dl-btn:disabled{background:#c9d6e2;cursor:not-allowed}
.dlstat{font-size:12.5px;color:var(--text2);min-height:18px;margin-top:10px}
.note{margin-top:10px;font-size:12.5px;color:var(--text2);background:#fff8e6;border:1px solid #f5dfa0;border-radius:8px;padding:9px 12px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{padding:8px 14px;border:none;background:none;font-size:12.5px;font-weight:700;color:var(--text2)}
.seg button.on{background:var(--primary);color:#fff}
.search{flex:1;min-width:180px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--card)}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#f3f7fb;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);padding:9px 12px;white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--border);white-space:nowrap}
.tbl td:nth-child(4){white-space:normal;min-width:160px}
.tbl .r{text-align:right}.tbl tfoot td{font-weight:800;background:#f8fafc}
.tbl td.act{white-space:nowrap}.act button{padding:5px 9px;margin-right:6px;border:1.5px solid var(--border);border-radius:7px;background:var(--card);font-size:12px;font-weight:700;color:var(--primary)}
.act button:hover{border-color:var(--primary)}
.nofile{font-size:12px;color:var(--text3)}
.no{font-weight:800;font-size:12px;padding:2px 7px;border-radius:6px}.no.income{background:#e6f6ec;color:#15803d}.no.expense{background:#fdeaea;color:#b91c1c}
.emp-h{margin:22px 0 8px}.emp-h b{font-size:15px}.emp-h span{font-size:12.5px;color:var(--text2);margin-left:10px}
.empty-msg{text-align:center;padding:26px 10px;color:var(--text3);font-size:13px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.back{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-size:18px;color:var(--text)}
.ph h1{margin:0;font-size:20px}

/* overlays */
.ov{display:none;position:fixed;inset:0;z-index:9000;background:rgba(15,30,50,.45);align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px 26px;box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:92vh;overflow-y:auto}
.sheet h2{margin:0;font-size:17px}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.x{border:none;background:var(--card2);width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--text2)}
.fld{flex:1;font-size:11px;color:var(--text3)}
.fld input{width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--card2);color:var(--text);font-size:14px}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;margin-top:8px}
.btn.p{background:var(--primary);color:#fff}.btn.o{background:var(--card2);border:1.5px solid var(--primary);color:var(--primary)}.btn.g{background:none;border:1.5px solid var(--border);color:var(--text2);font-size:13px;font-weight:600;padding:10px}
.pre{padding:6px 12px;border-radius:999px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:700;color:var(--text2);margin-right:6px}
#viewer{display:none;position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,.92);align-items:center;justify-content:center;flex-direction:column;padding:14px}
#viewer.open{display:flex}
#viewer .vb{position:absolute;top:12px;right:12px;display:flex;gap:8px}
#viewer .vb button{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-weight:700}
.page-ov{display:none;position:fixed;inset:0;z-index:9500;background:var(--bg);overflow-y:auto}
.page-ov.open{display:block}
.page-in{max-width:860px;margin:0 auto;padding:18px 20px 60px}
.legal h2{font-size:15px;margin:20px 0 6px}.legal p{font-size:13px;line-height:1.65;color:var(--text2);margin:0}.legal a{color:var(--primary)}
.legal-footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text3);text-align:center}

/* timesheet */
.ts-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
.ts-nav button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-size:16px}
.ts-m{font-weight:800;font-size:16px}
.ts-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.ts-stats div{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;font-size:11px;color:var(--text3)}.ts-stats b{display:block;font-size:16px;color:var(--text);margin-top:2px}
.ts-row{display:grid;grid-template-columns:62px 34px minmax(0,1fr) 62px;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);font-size:12.5px;background:var(--card)}
.ts-row.wk{background:var(--card2);color:var(--text3)}
.ts-row .st{font-weight:700}.st-urlaub{color:#2563eb}.st-krankenstand{color:#bb1614}.st-karenz{color:#7c3aed}.st-feiertag{color:#d97706}
.ts-hol{grid-column:1/-1;font-size:11px;color:#d97706}
.ts-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}

@media (max-width:720px){
  .topbar{padding:12px 16px;flex-wrap:wrap;row-gap:10px}.tb-brand{flex:1 0 100%}.tb-act{flex:1 0 100%}.tb-act .tb-btn{flex:1;padding:8px 6px;font-size:11.5px}.tb-t2{max-width:70vw}
  .pbar-in,.tabbar,.content{padding-left:14px;padding-right:14px}
  .kpis{grid-template-columns:repeat(2,1fr)}.dls{grid-template-columns:1fr}
  .dl{flex-wrap:wrap}.dl-btn{width:100%}
  .ts-stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div id="screenLogin" class="auth-wrap">
  <div class="auth-card">
    <img src="logo-circle.png" class="auth-logo" alt="Trabis"/>
    <div class="auth-title">Buchhalter-Zugang</div>
    <div class="auth-sub">Nur-Lese-Ansicht für Steuerberater</div>
    <div class="auth-error" id="loginError"></div>
    <input class="auth-input" id="buUser" placeholder="Benutzername / E-Mail" autocomplete="username"/>
    <input class="auth-input" id="buPass" type="password" placeholder="Passwort" autocomplete="current-password" onkeydown="if(event.key==='Enter')buLogin()"/>
    <button class="auth-btn" onclick="buLogin()">Anmelden</button>
    <div class="auth-note">Schreibgeschützt: Sie sehen nur, was Ihr Mandant für Sie freigegeben hat. Jeder Zugriff wird protokolliert.</div>
  </div>
</div>

<div id="screenClients" class="auth-wrap" style="display:none">
  <div class="auth-card" style="max-width:440px">
    <div class="auth-title">Mandant auswählen</div>
    <div class="auth-sub" id="clientsSub">Welche Firma möchten Sie einsehen?</div>
    <ul class="acct-list" id="clientList"></ul>
    <div class="auth-error" id="clientsError"></div>
    <button class="tb-btn" style="margin-top:6px" onclick="buLogout()">Abmelden</button>
  </div>
</div>

<div id="screenApp" style="display:none">
  <div class="topbar">
    <div class="tb-brand"><img src="logo-circle.png" alt="Trabis"/><div><div class="tb-t1">Trabis <span class="ro-badge">Nur lesen</span></div><div class="tb-t2" id="tbClient">—</div></div></div>
    <div class="tb-act">
      <button class="tb-btn" onclick="buShowClients()">Mandant wechseln</button>
      <button class="tb-btn" onclick="buOpenLegal()">Rechtliches</button>
      <button class="tb-btn" onclick="buLogout()">Abmelden</button>
    </div>
  </div>
  <div id="view"></div>
</div>

<div class="page-ov" id="tsOv"><div class="page-in" id="tsBody"></div></div>
<div class="page-ov" id="legalOv"><div class="page-in"><button class="back" onclick="document.getElementById('legalOv').classList.remove('open')">&#8592;</button><div class="legal" id="legalBody"></div></div></div>
<div id="viewer"><div class="vb"><button onclick="buViewerDownload()">Herunterladen</button><button onclick="buCloseViewer()">Schließen</button></div><div id="viewerContent"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="trabis-package.js"></script>
<script>
// ════════════════════════════════════════════════════════════════════════════
// Trabis Buchhalter-Portal — read-only accountant view, German only.
//
// All data access goes through BuApi (one place to swap). Two backends:
//   • local  (default)  — same-browser localStorage/IndexedDB, for the prototype.
//   • remote            — set window.BU_API_BASE = 'https://…' before this script and
//                         the portal talks to the server (contract: ACCOUNTANT_SHARING.md).
// Nothing below BuApi knows or cares which one is active. No writes to business data.
// ════════════════════════════════════════════════════════════════════════════

var ACCOUNTANT_CREDENTIALS = { 'buchhalter': 'Steuer2026!' };   // local mode only; remote mode uses real accounts

var BuApi = (function() {
  var base = (window.BU_API_BASE || '').replace(/\/$/, '');
  var remote = !!base;
  function ukFor(u, k) { return 'smartac_u_' + u + '_' + k; }
  function rj(u, k, fb) { var r = localStorage.getItem(ukFor(u, k)); if(!r) return fb; try { return JSON.parse(r); } catch(e) { return fb; } }
  function rs(u, k, fb) { var v = localStorage.getItem(ukFor(u, k)); return (v == null || v === '') ? fb : v; }
  function http(method, path, body) {
    var h = {'Accept': 'application/json'}, tok = sessionStorage.getItem('bu_token');
    if(tok) h.Authorization = 'Bearer ' + tok;
    if(body) h['Content-Type'] = 'application/json';
    return fetch(base + path, {method: method, headers: h, body: body ? JSON.stringify(body) : undefined}).then(function(r) {
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r;
    });
  }
  function idbGet(db, store, id) {
    var chk = indexedDB.databases ? indexedDB.databases().then(function(l) { return l.some(function(d) { return d.name === db; }); }).catch(function() { return false; }) : Promise.resolve(true);
    return chk.then(function(ok) {
      if(!ok) return null;
      return new Promise(function(res) {
        var rq = indexedDB.open(db);          // never pass a version: must not create/upgrade the owner's DB
        rq.onupgradeneeded = function(e) { e.target.transaction.abort(); };
        rq.onerror = function() { res(null); };
        rq.onsuccess = function(e) {
          var d = e.target.result;
          if(!d.objectStoreNames.contains(store)) { d.close(); res(null); return; }
          var r = d.transaction(store).objectStore(store).get(id);
          r.onsuccess = function() { d.close(); res(r.result || null); };
          r.onerror = function() { d.close(); res(null); };
        };
      });
    });
  }
  return {
    mode: remote ? 'remote' : 'local',
    // → Promise<true> or rejects with a German message
    login: function(user, pass) {
      if(remote) return http('POST', '/auth/accountant/login', {email: user, password: pass}).then(function(r) { return r.json(); }).then(function(j) { sessionStorage.setItem('bu_token', j.token); return true; }, function() { throw new Error('Benutzername oder Passwort falsch.'); });
      return (ACCOUNTANT_CREDENTIALS[user] && ACCOUNTANT_CREDENTIALS[user] === pass) ? Promise.resolve(true) : Promise.reject(new Error('Benutzername oder Passwort falsch.'));
    },
    // → Promise<[{id, name, sub}]>
    listClients: function() {
      if(remote) return http('GET', '/accountant/clients').then(function(r) { return r.json(); });
      var acc = {}; try { acc = JSON.parse(localStorage.getItem('smartac_accounts') || '{}'); } catch(e) {}
      return Promise.resolve(Object.keys(acc).map(function(u) { return {id: u, name: acc[u].businessName || u, sub: '@' + u}; }));
    },
    // → Promise<{businessName, businessAddress, businessTaxId, businessType, transactions[], recurring[], fixedIncome[], employees[], contacts[]}>
    loadClient: function(id) {
      if(remote) return http('GET', '/accountant/clients/' + encodeURIComponent(id) + '/snapshot').then(function(r) { return r.json(); });
      var acc = {}; try { acc = JSON.parse(localStorage.getItem('smartac_accounts') || '{}'); } catch(e) {}
      return Promise.resolve({
        businessName: (acc[id] && acc[id].businessName) || id, businessAddress: rs(id, 'bizAddress', ''), businessTaxId: rs(id, 'bizTaxId', ''),
        businessType: rs(id, 'businessType', 'general'),
        transactions: rj(id, 'tx', []), recurring: rj(id, 'recurring', []), fixedIncome: rj(id, 'fixed_income', []),
        employees: rj(id, 'employees', []), contacts: rj(id, 'contacts', [])
      });
    },
    // kind: 'receipt' | 'empdoc'  → Promise<{blob, type, name}|null>
    getFile: function(clientId, kind, fileId) {
      if(remote) return http('GET', '/accountant/clients/' + encodeURIComponent(clientId) + '/files/' + kind + '/' + encodeURIComponent(fileId)).then(function(r) {
        return r.blob().then(function(b) { return {blob: b, type: b.type, name: ''}; });
      }).catch(function() { return null; });
      return kind === 'empdoc' ? idbGet('smartac_empdocs', 'docs', fileId) : idbGet('smartac_receipts', 'receipts', fileId);
    },
    audit: function(clientId, action, object) { if(remote) http('POST', '/accountant/audit', {clientId: clientId, action: action, object: object || null}).catch(function() {}); }
  };
})();

// ── small helpers ───────────────────────────────────────────────────────────
function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function jq(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function deNum(n) { n = Math.round((n + (n < 0 ? -1e-9 : 1e-9)) * 100) / 100; return n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function eur(n) { return '€ ' + deNum(n); }
function sgn(n) { return (Math.abs(n) < 0.005 ? '' : (n > 0 ? '+' : '−')) + '€ ' + deNum(Math.abs(n)); }
function cls(n) { return Math.abs(n) < 0.005 ? 'zero' : (n > 0 ? 'pos' : 'neg'); }
function deDate(iso) { return iso ? iso.substring(8, 10) + '.' + iso.substring(5, 7) + '.' + iso.substring(0, 4) : '—'; }
var MON = ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
var MON3 = ['Jän','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
var WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];

// ── ported from the app (same maths, so both sides show the same numbers) ──
var WT_FIXED_HOL = {'0-1':'Neujahr','0-6':'Heilige Drei Könige','4-1':'Staatsfeiertag','7-15':'Mariä Himmelfahrt','9-26':'Nationalfeiertag','10-1':'Allerheiligen','11-8':'Mariä Empfängnis','11-25':'Christtag','11-26':'Stefanitag'};
function whTimeDiffHours(start, end, breakMinutes) {
  if(!start || !end) return null;
  var sp = start.split(':'), ep = end.split(':');
  var startMin = parseInt(sp[0], 10) * 60 + parseInt(sp[1], 10);
  var endMin = parseInt(ep[0], 10) * 60 + parseInt(ep[1], 10);
  if(endMin <= startMin) endMin += 24 * 60;

  return monthNames[parseInt(parts[1],10)-1] + ' ' + parts[0];
}

  if(entry.hours != null && entry.hours !== '') return parseFloat(entry.hours) || 0;
  var fromTimes = whTimeDiffHours(entry.start, entry.end, entry.breakMinutes);
  return fromTimes != null ? fromTimes : 0;
}

function whDayEntry(emp, day) {

    var wd = whEntryDate(w);
    return wd === day && (!w.toDate || w.toDate === wd);
  });
}

function whDayLeavePeriod(emp, day) {

}

  var parts = monthKey.split('-');

  var lastDay = new Date(year, month, 0).getDate();

}

function wtEaster(y) {
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  var f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  var h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  var l = (32 + 2 * e + 2 * i - h - k) % 7, mm = Math.floor((a + 11 * h + 22 * l) / 451);

}

  var p = day.split('-'), y = +p[0], m = +p[1] - 1, d = +p[2];

  var easter = wtEaster(y), t = new Date(y, m, d).getTime();
  var moving = [[1,'Ostermontag'],[39,'Christi Himmelfahrt'],[50,'Pfingstmontag'],[60,'Fronleichnam']];
  for(var i = 0; i < moving.length; i++) {

}

function wtDayInfo(emp, day) {

}

  whDaysInMonth(monthKey).forEach(function(day) {
    var i = wtDayInfo(emp, day);
    if(i.st === 'urlaub') s.urlaub++;
    else if(i.st === 'krankenstand') s.krank++;

function wtVacation(emp, monthKey) {
  var res = {hasHire: !!emp.startDate, months: 0, used: 0, factor: parseFloat(emp.vacationFactor) || 2.08};
  if(!emp.startDate) { res.entitled = 0; res.rest = 0; return res; }
  var hm = emp.startDate.substring(0, 7);
  var hy = +hm.substring(0, 4), hmo = +hm.substring(5, 7), y = +monthKey.substring(0, 4), m = +monthKey.substring(5, 7);

  var e = (S.data.employees || []).filter(function(x) { return x.id === S.ts.empId; })[0]; if(!e) return;
  var mk = S.ts.month, st = wtMonthStats(e, mk), vac = wtVacation(e, mk);
  var h = '<div class="ph"><button class="back" onclick="$(\'tsOv\').classList.remove(\'open\')">&#8592;</button><h1>' + esc(empName(e)) + '</h1></div>'
    + '<div class="ts-nav"><button onclick="tsShift(-1)">&#8249;</button><div class="ts-m">' + MON[+mk.substring(5, 7) - 1] + ' ' + mk.substring(0, 4) + '</div><button onclick="tsShift(1)">&#8250;</button></div>'
    + '<div class="ts-stats num"><div>Arbeitsstunden<b>' + deNum(st.hours) + ' h</b></div><div>Arbeitstage<b>' + st.workDays + '</b></div><div>Urlaub / Krank / Karenz<b>' + st.urlaub + ' / ' + st.krank + ' / ' + st.karenz + '</b></div><div>Resturlaub<b>' + (vac.hasHire ? deNum(vac.rest) : '—') + '</b></div></div>'
    + (vac.hasHire ? '<div style="font-size:12px;color:var(--text3);margin:-4px 0 12px">Urlaubsanspruch: ' + vac.months + ' Monate × ' + deNum(vac.factor) + ' = ' + deNum(vac.entitled) + ' Tage · verbraucht ' + vac.used + '</div>' : '')
    + '<div class="ts-card">';
  whDaysInMonth(mk).forEach(function(day) {
    var i = wtDayInfo(e, day), dow = new Date(+day.substring(0, 4), +day.substring(5, 7) - 1, +day.substring(8)).getDay();
    var hrs = i.entry ? whComputeHours(i.entry) : 0, label = '';
    if(i.st) label = '<span class="st st-' + i.st + '">' + (LEAVE_L[i.st] || i.st) + '</span>' + (i.leave && i.leave.docId ? ' <a href="#" onclick="openEmpDoc(\'' + jq(i.leave.docId) + '\');return false" style="color:var(--primary)">Beleg</a>' : '');
    else if(i.entry) label = (i.entry.start || '') + ' – ' + (i.entry.end || '') + (i.entry.breakMinutes ? ' · Pause ' + i.entry.breakMinutes + ' min' : '');
    h += '<div class="ts-row num' + ((dow === 0 || dow === 6) ? ' wk' : '') + '"><span>' + pad2(+day.substring(8)) + '.' + day.substring(5, 7) + '.</span><span>' + WD[dow] + '</span><span>' + label + '</span><span style="text-align:right;font-weight:700">' + (hrs > 0 ? deNum(hrs) + ' h' : '') + '</span>'
      + (i.hol ? '<div class="ts-hol">&#127881; ' + esc(i.hol) + '</div>' : '') + '</div>';
  });
  $('tsBody').innerHTML = h + '</div>';
}
function openEmpDoc(id) { BuApi.getFile(S.clientId, 'empdoc', isNaN(+id) ? id : +id).then(function(r) { if(r && r.blob) viewBlob(r.blob, r.name || 'Beleg'); else alert('Dokument nicht gefunden.'); }); }

// ── government entities ─────────────────────────────────────────────────────
function govTxMatches(tx, c) {
  if(!tx || tx.type !== 'expense') return false;
  if(tx.govId != null) return tx.govId === c.id;
  var n = (c.name || '').toLowerCase().trim(); if(!n) return false;
  var hay = ((tx.name || '') + ' ' + (tx.supplierName || '')).toLowerCase();
  if(hay.indexOf(n) >= 0) return true;
  var first = n.split(/\s+/)[0]; if(first.length < 3) return false;
  return new RegExp('(^|[^a-zäöüß])' + first.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^a-zäöüß])').test(hay);
}
function viewGov(P) {
  var ents = (S.data.contacts || []).filter(function(c) { return c && c.type === 'government'; });
  if(!ents.length) return '<div class="empty-msg">Keine Behörden erfasst.</div>';
  var inRange = function(d) { var k = (d || '').substring(0, 7); return k >= S.from && k <= S.to; };
  var h = '';
  ents.forEach(function(c) {
    var pays = (S.data.transactions || []).filter(function(t) { return govTxMatches(t, c) && inRange(t.date); }).sort(function(a, b) { return a.date < b.date ? -1 : 1; });
    var sum = pays.reduce(function(s, t) { return s + (parseFloat(t.amount) || 0); }, 0);
    h += '<div class="emp-h"><b>' + esc(c.name) + '</b><span>' + pays.length + ' Zahlung' + (pays.length === 1 ? '' : 'en') + ' im Zeitraum · ' + eur(sum) + '</span></div>';
    if(pays.length) h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Datum</th><th>Buchungstext</th><th class="r">Betrag</th></tr></thead><tbody>'
      + pays.map(function(t) { return '<tr><td class="num">' + deDate(t.date) + '</td><td>' + esc(t.name) + '</td><td class="r num">' + eur(parseFloat(t.amount) || 0) + '</td></tr>'; }).join('') + '</tbody></table></div>';
  });
  return h;
}

// ── downloads ───────────────────────────────────────────────────────────────
function attachBytes(tx) { return getAttachment(tx).then(function(a) { return a ? a.blob.arrayBuffer().then(function(ab) { return {bytes: new Uint8Array(ab), type: a.type}; }) : null; }); }
function pkBuild(kind) {
  var st = $('dlStatus'); if(st) st.textContent = 'Wird erstellt…';
  var emps = [];
  (S.data.employees || []).forEach(function(e) {
    TrabisPackage.monthRange(S.from, S.to).forEach(function(mk) {
      var s = wtMonthStats(e, mk), v = wtVacation(e, mk);
      if(!(s.hours > 0 || s.urlaub || s.krank || s.karenz)) return;
      emps.push({name: empName(e), month: mk, hours: s.hours, workDays: s.workDays, urlaub: s.urlaub, krank: s.krank, karenz: s.karenz, feiertag: s.feiertag, entitled: v.entitled || 0, rest: v.rest || 0});
    });
  });
  var opts = {company: {name: S.data.businessName, address: S.data.businessAddress, taxId: S.data.businessTaxId}, from: S.from, to: S.to, transactions: txRows(), employees: emps, getAttachment: attachBytes};
  var done = function(msg) { if($('dlStatus')) $('dlStatus').textContent = msg; };
  if(kind === 'zip' || kind === 'zipsel') {
    if(kind === 'zipsel') opts.onlyIds = Object.keys(S.sel).filter(function(k) { return S.sel[k]; });
    return TrabisPackage.bundle(opts).then(function(r) {
      if(!r.count) { done('Keine Belege im Zeitraum.'); return; }
      TrabisPackage.download(r.zip, r.base + '.zip', 'application/zip'); done(r.count + ' Belege heruntergeladen.'); BuApi.audit(S.clientId, 'export_zip', S.from + '..' + S.to);
    }).catch(function(e) { done('Fehler: ' + (e && e.message || e)); });
  }
  opts.want = {pdf: kind === 'pdf', xlsx: kind === 'xlsx', csv: kind === 'csv'};
  return TrabisPackage.build(opts).then(function(r) {
    if(!r.counts.income && !r.counts.expense) { done('Keine Buchungen in diesem Zeitraum.'); return; }
    if(kind === 'pdf') TrabisPackage.download(r.pdf, r.base + '.pdf', 'application/pdf');
    if(kind === 'xlsx') TrabisPackage.download(r.xlsx, r.base + '.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    if(kind === 'csv') TrabisPackage.download(r.csv, r.base + '.csv', 'text/csv;charset=utf-8');
    done('Fertig — Datei heruntergeladen.'); BuApi.audit(S.clientId, 'export_package', S.from + '..' + S.to + ' ' + kind);
  }).catch(function(e) { done('Fehler: ' + (e && e.message || e)); });
}
