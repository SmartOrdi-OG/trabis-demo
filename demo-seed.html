  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding:24px;line-height:1.7}

  button{width:100%;padding:15px;border-radius:12px;border:none;background:var(--primary);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
  button:disabled{opacity:0.6;cursor:default}
  button.secondary{background:var(--card);color:var(--text);border:1.5px solid var(--border)}
  button.danger{background:var(--card);color:var(--red);border:1.5px solid var(--red)}
  #status{margin-top:16px;font-size:13.5px;padding:12px 14px;border-radius:10px;display:none}
  #status.ok{display:block;background:rgba(22,163,74,0.08);color:var(--green)}
  #status.err{display:block;background:rgba(239,68,68,0.08);color:var(--red)}
  #status.busy{display:block;background:rgba(26,127,212,0.08);color:var(--primary)}
  ul{font-size:13.5px;color:var(--text2);padding-inline-start:20px;margin:8px 0 0}
  li{margin-bottom:4px}
  .warn{font-size:12.5px;color:var(--text2);background:rgba(184,134,11,0.08);border-inline-start:3px solid #b8860b;padding:10px 12px;border-radius:8px;margin-top:14px}

  .creds div{margin-top:4px}
  .creds code{background:rgba(0,0,0,0.06);padding:2px 6px;border-radius:5px;font-size:12.5px}
  .langbar{display:flex;gap:6px;justify-content:flex-end;margin-bottom:12px}
  .langbar button{width:auto;padding:6px 14px;margin:0;font-size:12.5px;font-weight:600;background:var(--card);color:var(--text2);border:1.5px solid var(--border)}

// ── date helpers (relative to "today" so the demo never looks stale) ──
function pad2(n){ return (n<10?'0':'')+n; }
function fmtDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function daysAgo(n){ var d=new Date(); d.setDate(d.getDate()-n); return fmtDate(d); }
function monthsAgoRange(n){ // returns [firstOfMonth, lastOfMonth] for "n months ago"
  var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-n);
  var first=fmtDate(d);
  var last=new Date(d.getFullYear(), d.getMonth()+1, 0);
  return {first:first, lastDay:last.getDate(), y:d.getFullYear(), m:d.getMonth()+1};
}
function todayStr(){ return fmtDate(new Date()); }

// ── tiny canvas-drawn placeholder documents (receipt / medical certificate look) ──
function makeReceiptImage(lines){
  var c = document.createElement('canvas'); c.width=400; c.height=560;
  var ctx = c.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,400,560);
  ctx.strokeStyle='#ddd'; ctx.strokeRect(4,4,392,552);
  ctx.fillStyle='#222'; ctx.font='bold 20px monospace'; ctx.textAlign='center';
  ctx.fillText('BELEG', 200, 40);
  ctx.font='13px monospace'; ctx.textAlign='left';
  var y=80;
  lines.forEach(function(l){ ctx.fillText(l, 24, y); y+=26; });
  ctx.strokeStyle='#999';
  ctx.beginPath(); ctx.moveTo(24,y+10); ctx.lineTo(376,y+10); ctx.stroke();
  return new Promise(function(res){ c.toBlob(function(b){ res(b); }, 'image/png'); });
}
function makeCertImage(name, from, to){
  var c = document.createElement('canvas'); c.width=420; c.height=560;
  var ctx = c.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,420,560);
  ctx.strokeStyle='#ccc'; ctx.strokeRect(4,4,412,552);
  ctx.fillStyle='#1a4d8f'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center';
  ctx.fillText('ÄRZTLICHE BESTÄTIGUNG', 210, 50);
  ctx.fillText('(Demo-Dokument)', 210, 74);
  ctx.fillStyle='#222'; ctx.font='14px sans-serif'; ctx.textAlign='left';
  var y=130;
  [ 'Patient/in: ' + name, 'Krankenstand von: ' + from, 'bis: ' + to, '', 'Dr. Med. Musterfrau', 'Allgemeinmedizin, Wien' ].forEach(function(l){ ctx.fillText(l, 30, y); y+=28; });
  return new Promise(function(res){ c.toBlob(function(b){ res(b); }, 'image/png'); });
}

// ── generic IndexedDB put (mirrors the store schemas used by index.html) ──
function idbPut(dbName, storeName, keyPath, rec){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open(dbName, 1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains(storeName)) db.createObjectStore(storeName, {keyPath:keyPath});
    };
    req.onsuccess = function(e){
      var db = e.target.result;
      var t = db.transaction(storeName, 'readwrite');
      t.objectStore(storeName).put(rec);
      t.oncomplete = function(){ db.close(); resolve(); };
      t.onerror = function(){ db.close(); reject(t.error); };
    };
    req.onerror = function(){ reject(req.error); };
  });
}

    await idbPut('smartac_receipts', 'receipts', 'id', { id:cafeReceiptTxId, user:'demo_cafe', name:'beleg_kaffee.png', type:'image/png', blob:receiptBlob, createdAt:new Date().toISOString() });
    var certBlob = await makeCertImage('Lukas Wagner', daysAgo(9), daysAgo(7));
    await idbPut('smartac_empdocs', 'docs', 'id', { id:cafeCertDocId, empId:cafeEmpId, user:'demo_cafe', name:'krankmeldung.png', type:'image/png', blob:certBlob, createdAt:new Date().toISOString() });

    // ══════════════ DEMO 2: Alpen Transporte (transport) ══════════════
    var trEmpId = Date.now()+5000;
    var trReceiptTxId = trEmpId+1;

    var trEmployees = [
      { id: trEmpId, fullName:'Stefan Moser', position:'Fahrer', salary:2600, workHours: (function(){
          var arr=[]; for(var i=1;i<=10;i++){ arr.push({id:trEmpId+10+i, date:daysAgo(i*2), fromDate:daysAgo(i*2), toDate:daysAgo(i*2), start:'06:00', end:'15:00', breakMinutes:30, hours:8.5}); } return arr;
        })(), leavePeriods:[], documents:[] },
    ];

    var trClients = [
      {id:trEmpId+200, name:'Bau Nord GmbH', company:'Bau Nord GmbH', phone:'+43 1 7778899', email:'logistik@bau-nord.at', country:'Austria', address:'Industriestraße 5, Linz', notes:'Wöchentliche Baustellenlieferungen', since:daysAgo(500)},
    ];
    var trSuppliers = [
      {id:trEmpId+300, name:'OMV Tankstelle', company:'OMV', phone:'', email:'', country:'Austria', address:'', notes:'Tanken', since:daysAgo(600), serviceType:'Treibstoff'},
      {id:trEmpId+301, name:'KFZ Meisterbetrieb Roth', company:'', phone:'+43 664 1119988', email:'', country:'Austria', address:'', notes:'Wartung & Reparatur', since:daysAgo(500), serviceType:'Wartung'},
    ];

    var trTx = [];
    var trTxId = trEmpId+1000;
    for(var m2=0; m2<3; m2++){
      var mr2 = monthsAgoRange(m2);
      for(var j=0;j<4;j++){
        var day2 = Math.min(4+j*6, mr2.lastDay);
        trTx.push({id:trTxId++, name:'Transportauftrag', amount: 950+Math.round(Math.random()*350), type:'income', category:'Sales', date: mr2.y+'-'+pad2(mr2.m)+'-'+pad2(day2), vatRate:20, invoice:null, invoiceName:null, clientId:trClients[0].id, clientName:trClients[0].name});
      }
      var fDay = Math.min(6, mr2.lastDay);
      trTx.push({id:trTxId++, name:'Diesel', amount: 380+Math.round(Math.random()*60), type:'expense', category:'Fuel', date: mr2.y+'-'+pad2(mr2.m)+'-'+pad2(fDay), vatRate:20, invoice:null, invoiceName:null, supplierId:trSuppliers[0].id, supplierName:trSuppliers[0].name});
      var vDay = Math.min(20, mr2.lastDay);
      trTx.push({id:trTxId++, name:'Wartung LKW', amount: 260, type:'expense', category:'Vehicle', date: mr2.y+'-'+pad2(mr2.m)+'-'+pad2(vDay), vatRate:20, invoice:null, invoiceName:null, supplierId:trSuppliers[1].id, supplierName:trSuppliers[1].name});
    }
    var trReceiptDate = daysAgo(3);
    trTx.push({id:trReceiptTxId, name:'Diesel Tankstopp', amount:92, type:'expense', category:'Fuel', date:trReceiptDate, vatRate:20, invoice:null, invoiceName:null, supplierId:trSuppliers[0].id, supplierName:trSuppliers[0].name, receiptId:trReceiptTxId, receiptName:'beleg_diesel.png'});

    var trFleet = [
      { id: trEmpId+2000, plate:'W-123AB', name:'Mercedes Sprinter', type:'LKW', year:'2021', notes:'Hauptfahrzeug', documents:[], maintenance:[],
        acqType:'owned', assetValue: 42000, assetPurchaseDate: daysAgo(700), assetVatRate: 20 },
    ];
    var trDebts = [
      {id:trEmpId+2100, person:'Bau Nord GmbH', amount:1180, category:'Sales', date:daysAgo(6), status:'pending', type:'owes-me', clientId:trClients[0].id, supplierId:null},
    ];
    var trIssuedInvoices = [
      {id:trEmpId+2200, number:'INV-2044', issueDate:daysAgo(6), dueDate:daysAgo(-24), items:[{desc:'Transportauftrag KW', qty:1, price:1180, sub:1180, category:'Sales'}], vatRate:20, notes:'', subtotal:983.33, vatAmount:196.67, total:1180, status:'Pending', currency:'€', clientId:trClients[0].id, clientName:trClients[0].name},
    ];

    writeAccountData('demo_transport', {
      transactions: trTx, clients: trClients, suppliers: trSuppliers, employees: trEmployees,
      debts: trDebts, fleet: trFleet, issuedInvoices: trIssuedInvoices,
      businessType:'transport', currency:'€', lang:'de', businessName:'Alpen Transporte',
    });
    accounts['demo_transport'].businessName = 'Alpen Transporte';
    localStorage.setItem('smartac_accounts', JSON.stringify(accounts));

    var trReceiptBlob = await makeReceiptImage(['OMV Tankstelle', 'Datum: '+trReceiptDate, 'Diesel 65,3 L', 'Gesamt: EUR 92,00', 'Zahlungsart: Karte']);
    await idbPut('smartac_receipts', 'receipts', 'id', { id:trReceiptTxId, user:'demo_transport', name:'beleg_diesel.png', type:'image/png', blob:trReceiptBlob, createdAt:new Date().toISOString() });

    setStatus(L[currentLang].okMsg, 'ok');
    document.getElementById('openBuchhalterBtn').style.display = 'block';
  } catch(e) {
    setStatus(L[currentLang].errMsg + e.message, 'err');
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

function clearDemoData(){
  if(!confirm(L[currentLang].clearConfirm)) return;
  ['demo_cafe','demo_transport'].forEach(function(user){
    var keys = [];
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k && k.indexOf('smartac_u_'+user+'_')===0) keys.push(k); }
    keys.forEach(function(k){ localStorage.removeItem(k); });
  });
  var accounts = JSON.parse(localStorage.getItem('smartac_accounts') || '{}');
  delete accounts['demo_cafe']; delete accounts['demo_transport'];
  localStorage.setItem('smartac_accounts', JSON.stringify(accounts));
  setStatus(L[currentLang].clearedMsg, 'ok');
  document.getElementById('openBuchhalterBtn').style.display = 'none';
}
</script>
